<!DOCTYPE html>
<html lang="yez" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُحوِّل ولوحة الكتابة الإيزيدية - Ezidki Transliteration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 850px;
        }

        h1 {
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 5px;
            text-align: center;
        }

        p.subtitle {
            color: #7f8c8d;
            text-align: center;
            margin-bottom: 20px;
            font-size: 15px;
        }

        textarea {
            width: 100%;
            height: 220px;
            font-size: 26px;
            padding: 15px;
            border: 2px solid #ced4da;
            border-radius: 8px;
            resize: vertical;
            box-sizing: border-box;
            outline: none;
            direction: rtl;
            line-height: 1.6;
        }

        textarea:focus {
            border-color: #f39c12;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            background-color: #f39c12;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #d35400;
        }

        .btn-clear {
            background-color: #e74c3c;
        }

        .btn-clear:hover {
            background-color: #c0392b;
        }

        .info-box {
            margin-top: 20px;
            padding: 12px;
            background-color: #f1f2f6;
            border-right: 4px solid #f39c12;
            font-size: 14px;
            color: #57606f;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>مُحوِّل اللغة الإيزيدية</h1>
        <p class="subtitle">اكتب من لوحة مفاتيح جهازك (بالعربي أو الكورمانجي) وسيتحول النص فوراً إلى الحروف الإيزيدية</p>

        <textarea id="editor" placeholder="ابدأ الكتابة من كيبورد موبايلك أو الكمبيوتر..."></textarea>

        <div class="controls">
            <div class="btn-group">
                <button class="btn" onclick="copyText()">نسخ النص الإيزيدي</button>
                <button class="btn btn-clear" onclick="clearText()">مسح النص</button>
            </div>
            <span id="charCount" style="color: #7f8c8d;">عدد الحروف: 0</span>
        </div>

        <div class="info-box">
            💡 **ملاحظة:** يمكنك تعديل ربط الحروف العربية واللاتينية بالحروف الإيزيدية المطابقة لها داخل مصفوفة `charMap` في الكود بسهولة.
        </div>
    </div>

    <script>
        // جدول مطابقة الحروف (Map)
        // أضف أو عدّل الحروف العربية أو اللاتينية وما يقابلها بالحرف الإيزيدي الصحيح
        const charMap = {
            // الحروف العربية -> الإيزيدية
            'ا': '𐺀', 'أ': '𐺀', 'إ': '𐺀', 'آ': '𐺀',
            'ب': '𐺁',
            'پ': '𐺂',
            'ت': '𐺃',
            'ج': '𐺄',
            'چ': '𐺅',
            'ح': '𐺆',
            'خ': '𐺇',
            'د': '𐺈',
            'ر': '𐺉',
            'ز': '𐺊',
            'ژ': '𐺋',
            'س': '𐺌',
            'ش': '𐺍',
            'ع': '𐺎',
            'غ': '𐺏',
            'ف': '𐺐',
            'ڤ': '𐺑',
            'ق': '𐺒',
            'ك': '𐺓',
            'گ': '𐺔',
            'ل': '𐺕',
            'م': '𐺖',
            'ن': '𐺗',
            'ه': '𐺘',
            'و': '𐺙',
            'ي': '𐺚',
            'ى': '𐺚',

            // الحروف اللاتينية / الكورمانجية -> الإيزيدية
            'a': '𐺀', 'A': '𐺀',
            'b': '𐺁', 'B': '𐺁',
            'p': '𐺂', 'P': '𐺂',
            't': '𐺃', 'T': '𐺃',
            'c': '𐺄', 'C': '𐺄',
            'ç': '𐺅', 'Ç': '𐺅',
            'h': '𐺆', 'H': '𐺆',
            'x': '𐺇', 'X': '𐺇',
            'd': '𐺈', 'D': '𐺈',
            'r': '𐺉', 'R': '𐺉',
            'z': '𐺊', 'Z': '𐺊',
            'j': '𐺋', 'J': '𐺋',
            's': '𐺌', 'S': '𐺌',
            'ş': '𐺍', 'Ş': '𐺍',
            'e': '𐺎', 'E': '𐺎',
            'f': '𐺐', 'F': '𐺐',
            'v': '𐺑', 'V': '𐺑',
            'q': '𐺒', 'Q': '𐺒',
            'k': '𐺓', 'K': '𐺓',
            'g': '𐺔', 'G': '𐺔',
            'l': '𐺕', 'L': '𐺕',
            'm': '𐺖', 'M': '𐺖',
            'n': '𐺗', 'N': '𐺗',
            'w': '𐺙', 'W': '𐺙',
            'y': '𐺚', 'Y': '𐺚'
        };

        const editor = document.getElementById('editor');
        const charCount = document.getElementById('charCount');

        // حدث الاستماع عند الكتابة بالحرية وتحويل الحروف مباشرة
        editor.addEventListener('input', function(e) {
            let cursorPosition = this.selectionStart;
            let originalText = this.value;
            let convertedText = '';

            for (let i = 0; i < originalText.length; i++) {
                let char = originalText[i];
                // إذا كان الحرف موجوداً في جدول التحويل يتم استبداله
                convertedText += charMap[char] || char;
            }

            this.value = convertedText;
            
            // الحفاظ على موقع المؤشر أثناء الكتابة
            this.setSelectionRange(cursorPosition, cursorPosition);
            
            // تحديث عداد الحروف
            charCount.innerText = `عدد الحروف: ${Array.from(convertedText).length}`;
        });

        // دالة النسخ
        function copyText() {
            if (!editor.value) return;
            editor.select();
            navigator.clipboard.writeText(editor.value);
            alert("تم نسخ النص الإيزيدي إلى الحافظة!");
        }

        // دالة المسح
        function clearText() {
            editor.value = '';
            charCount.innerText = 'عدد الحروف: 0';
            editor.focus();
        }
    </script>

</body>
</html>
